<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea to Done</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        :root {
            --warm-bg: #FDF8F3;
            --warm-surface: #FFFFFF;
            --warm-surface2: #FEF3E8;
            --warm-border: #EAD9C8;
            --warm-border2: #D4B896;
            --warm-primary: #C17A3A;
            --warm-primary-dark: #9E5E22;
            --warm-text: #2D1E0F;
            --warm-text2: #7A5C40;
            --warm-text3: #A87D55;
            --warm-success: #4A7C59;
            --warm-success-bg: #EBF5EE;
            --warm-accent: #E8875A;
            --warm-accent-light: #FDE8DC;
            --warm-phase: #7B5EA7;
            --warm-phase-bg: #F0EBF8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--warm-bg);
            color: var(--warm-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
        }

        .itd-app {
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .wordmark {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--warm-primary);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wordmark-dot { width: 8px; height: 8px; background: var(--warm-accent); border-radius: 50%; }

        h1 { font-size: 28px; font-weight: 700; color: var(--warm-text); margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        .sub { font-size: 16px; color: var(--warm-text2); margin-bottom: 2rem; }

        .card {
            background: var(--warm-surface);
            border: 1px solid var(--warm-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 12px rgba(74, 63, 53, 0.03);
            margin-bottom: 1.5rem;
        }

        .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--warm-text3); margin-bottom: 10px; display: block; }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--warm-border);
            background: var(--warm-surface2);
            color: var(--warm-text);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--warm-primary); background: var(--warm-surface); }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary { background: var(--warm-primary); color: white; }
        .btn-primary:hover { background: var(--warm-primary-dark); }
        .btn-ghost { background: transparent; border: 1.5px solid var(--warm-border); color: var(--warm-text2); }

        .steps-nav { display: flex; gap: 8px; margin-bottom: 2rem; }
        .step-dot { flex: 1; height: 4px; background: var(--warm-border); border-radius: 2px; }
        .step-dot.active { background: var(--warm-accent); }

        .idea-pill {
            background: var(--warm-surface);
            border: 1px solid var(--warm-border);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .idea-pill i { color: var(--warm-text3); }

        .done-item { opacity: 0.6; text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="itd-app">
        <div id="screen-start" class="screen active">
            <div class="wordmark"><div class="wordmark-dot"></div> Idea to Done</div>
            <h1>What's on your mind?</h1>
            <p class="sub">Let's turn that spark into a plan.</p>
            <div class="card">
                <label class="lbl">Your Idea</label>
                <textarea id="idea-input" rows="3" placeholder="A new app, a garden project, a trip..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="showScreen('screen-plan')">Continue <i class="ti ti-arrow-right"></i></button>
        </div>

        <div id="screen-plan" class="screen">
            <div class="steps-nav"><div class="step-dot active"></div><div class="step-dot"></div><div class="step-dot"></div></div>
            <h1>Breaking it down</h1>
            <p class="sub">What are the key steps to make this happen?</p>
            <div id="steps-list" style="margin-bottom: 1.5rem;"></div>
            <div class="card" style="padding: 1rem;">
                <input type="text" id="step-input" placeholder="Add a step...">
            </div>
            <button class="btn btn-primary" onclick="showScreen('screen-done')">Ready to work <i class="ti ti-check"></i></button>
        </div>

        <div id="screen-done" class="screen">
            <div class="wordmark"><div class="wordmark-dot"></div> Focused</div>
            <h1>Let's get it done.</h1>
            <div id="todo-list"></div>
            <button class="btn btn-ghost" style="margin-top: 2rem;" onclick="location.reload()">Start New Idea</button>
        </div>
    </div>

    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        // Simplified app logic for the demo
    </script>
</body>
</html>
